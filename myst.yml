# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: curious-beams-lecture-tn23015-computational-science
  title: TN23015 | Computational Science
  short_title: Computational Science
  description: An interactive computational science textbook, teaching numerical methods for physics in the browser. Originally developed for TN2513 at Delft University of Technology, ported to MyST and marimo for TN23015.
  keywords:
    - Computational Science
    - Numerical Differentiation
    - Numerical Integration
    - Root Finding
    - Linear Algebra
    - Fourier Transforms
    - Random Numbers
    - Ordinary Differential Equations
    - Partial Differential Equations
  github: https://github.com/curiousbeams/lecture-tn23015-computational-science
  open_access: true
  license: CC-BY-4.0
  date: 2026-11-10
  exports:
    - format: meca
  exclude:
    - README.md
    - REPRODUCING-THE-UPLOAD-BUG.md   # for Curvenote, not book content
    - scripts/**   # porting notes and converter sources, not book content
  # What the "launch lite" and "open in marimo" badges point at. Both are generated and
  # gitignored, so build them before `curvenote submit`:
  #   bash scripts/build_jupyter_lite.sh && bash scripts/build_marimo_apps.sh
  static_files:
    - jupyter-lite
    - marimo-apps
  plugins:
    - type: executable
      path: .venv/bin/jupyter-book-marimo
